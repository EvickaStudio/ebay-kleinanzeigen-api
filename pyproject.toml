[project]
name = "ebay-kleinanzeigen-api"
version = "2.1.1"
description = "Refined Kleinanzeigen scraping API"
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi>=0.139.0",
    "fastapi-cache2>=0.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "slowapi>=0.1.9",
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0 ; sys_platform != 'win32'",
]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.6",
    "pytest>=9.0.3",
    "respx>=0.21.0",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
